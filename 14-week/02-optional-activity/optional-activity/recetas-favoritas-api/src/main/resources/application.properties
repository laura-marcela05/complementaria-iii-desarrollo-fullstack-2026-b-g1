# Base de datos H2 en memoria (se reinicia cada vez que se detiene la app)
spring.datasource.url=jdbc:h2:mem:recetasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea las tablas desde cero cada vez que arranca, a partir de las entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# La consola de H2 queda desactivada esta semana (Spring Security bloquearía su ruta)
spring.h2.console.enabled=false

# --- JWT ---
# Clave con la que el servidor firma y valida los tokens (mínimo 32 caracteres).
# En un proyecto real NO va en este archivo: se lee de una variable de entorno (JWT_SECRET).
app.jwt.secret=${JWT_SECRET:clave-secreta-de-la-actividad-semana-11-con-mas-de-32-caracteres}
# Duración del token: 1 hora, en milisegundos
app.jwt.expiration-ms=3600000
