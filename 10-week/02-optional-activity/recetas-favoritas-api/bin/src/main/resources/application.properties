# Base de datos H2 en memoria (se reinicia cada vez que se detiene la app)
spring.datasource.url=jdbc:h2:mem:recetasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea la tabla desde cero cada vez que arranca, a partir de la entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola web de H2, útil para ver los datos mientras pruebas (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
